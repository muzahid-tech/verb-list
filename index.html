/* Verbs that are stative / non-continuous in their main meaning */

`.split(',').map(s=>s.trim()).filter(Boolean));

/* =====================================================================
   BUILD MASTER LIST
   ===================================================================== */
const esc = s => String(s == null ? '' : s).replace(/[&<>"]/g,
  c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));

function parseRows(raw){
  return raw.trim().split('\n').map(l => l.trim()).filter(Boolean).map(line => {
    const p = line.split('|').map(s => s.trim());
    return { v1:p[0]||'', v2:p[1]||'—', v3:p[2]||'—', as:p[3]||'' };
  });
}

const MASTER = new Map();
function ingest(rows){
  rows.forEach(o => {
    const k = o.v1.toLowerCase();
    if(!MASTER.has(k)) MASTER.set(k, Object.assign({}, o, { key:k }));
  });
}
ingest(parseRows(RAW_CORE));
ingest(parseRows(RAW_EXTRA));
ingest(parseRows(RAW_STATE));

const VERBS = Array.from(MASTER.values()).map(o => {
  o.state = STATIVE_SET.has(o.key);
  return o;
}).sort((a,b) => a.v1.localeCompare(b.v1, 'en'));

/* =====================================================================
   s / es / ies GENERATOR
   ===================================================================== */
const NO_S = new Set(['can','may','must','shall','will','am/is/are','be']);
function sForm(k){
  const s = k.toLowerCase();
  if(s === 'be')   return 'is / am / are';
  if(s === 'have') return 'has';
  if(NO_S.has(s))  return '—';
  if(/(s|x|z|ch|sh|o)$/.test(s)) return s + 'es';
  if(/[^aeiou]y$/.test(s))       return s.slice(0,-1) + 'ies';
  return s + 's';
}

/* =====================================================================
   IRREGULAR DETECTION
   ===================================================================== */
function regularSet(v){
  const k = v.toLowerCase(), set = new Set();
  set.add(k + 'ed');
  if(k.endsWith('e')) set.add(k + 'd');
  if(/[^aeiou]y$/.test(k)) set.add(k.slice(0,-1) + 'ied');
  if(/[^aeiou][aeiou][bdgklmnprt]$/.test(k)) set.add(k + k.slice(-1) + 'ed');
  return set;
}
function isIrregular(o){
  if(o.v2 === '—' && o.v3 === '—') return false;
  const reg = regularSet(o.v1);
  const p2 = o.v2.toLowerCase(), p3 = o.v3.toLowerCase();
  if(p2 !== '—' && !reg.has(p2)) return true;
  if(p3 !== '—' && !reg.has(p3)) return true;
  return false;
}

/* =====================================================================
   STATE
   ===================================================================== */
const STATE = { q:'', tab:'all', letter:'*', shown:0 };
const PAGE = 60;
let FILTERED = [];

/* =====================================================================
   FILTERING
   ===================================================================== */
function computeList(){
  const q = STATE.q.trim().toLowerCase();
  return VERBS.filter(o => {
    if(STATE.tab === 'irr'   && !isIrregular(o)) return false;
    if(STATE.tab === 'reg'   &&  isIrregular(o)) return false;
    if(STATE.tab === 'state' && !o.state)        return false;
    if(STATE.letter !== '*' && o.v1[0].toLowerCase() !== STATE.letter) return false;
    if(!q) return true;
    return o.v1.toLowerCase().includes(q)
        || o.v2.toLowerCase().includes(q)
        || o.v3.toLowerCase().includes(q)
        || o.as.includes(q);
  });
}

/* =====================================================================
   RENDER
   ===================================================================== */
function cardHTML(o, n){
  const irr = isIrregular(o);
  return `<article class="vcard">
    <div class="vhead">
      <span class="vnum">${n}</span>
      <h3 class="v1">${esc(o.v1)}</h3>
      ${o.state ? '<span class="badge reg">stative</span>' : ''}
      <span class="badge ${irr?'irr':'reg'}">${irr?'irregular':'regular'}</span>
    </div>
    <div class="vgrid">
      <div class="vcell"><span class="vlbl">Past</span><span class="vval">${esc(o.v2)}</span></div>
      <div class="vcell"><span class="vlbl">Past Part.</span><span class="vval">${esc(o.v3)}</span></div>
      <div class="vcell"><span class="vlbl">s / es / ies</span><span class="vval">${esc(sForm(o.v1))}</span></div>
    </div>
    <div class="vmean">${esc(o.as)}</div>
  </article>`;
}

function build(){
  FILTERED = computeList();
  STATE.shown = 0;
  $('#list').empty();
  $('#resultCount').text(FILTERED.length.toLocaleString() + ' verbs');
  $('#empty').toggleClass('hidden', FILTERED.length !== 0);
  renderMore();
}

function renderMore(){
  const slice = FILTERED.slice(STATE.shown, STATE.shown + PAGE);
  if(!slice.length){ $('#loadMore').addClass('hidden'); return; }
  const html = slice.map((o,i) => cardHTML(o, STATE.shown + i + 1)).join('');
  $('#list').append(html);
  STATE.shown += slice.length;
  $('#loadMore').toggleClass('hidden', STATE.shown >= FILTERED.length);
}

/* =====================================================================
   LETTER INDEX
   ===================================================================== */
function buildLetters(){
  const letters = ['*'].concat('abcdefghijklmnopqrstuvwxyz'.split(''));
  const html = letters.map(l =>
    `<button class="lt ${l==='*'?'on':''}" data-l="${l}">${l==='*'?'ALL':l.toUpperCase()}</button>`
  ).join('');
  $('#letters').html(html);
}

/* =====================================================================
   THEME
   ===================================================================== */
function applyTheme(t){
  document.documentElement.setAttribute('data-theme', t);
  $('#themeBtn').text(t === 'dark' ? '🌙' : '☀️');
  $('meta[name="theme-color"]').attr('content', t === 'dark' ? '#0b1220' : '#f2f6fc');
  try{ localStorage.setItem('vv-theme', t); }catch(e){}
}
function initTheme(){
  let t = 'dark';
  try{ t = localStorage.getItem('vv-theme') || 'dark'; }catch(e){}
  applyTheme(t);
}

/* =====================================================================
   TOAST
   ===================================================================== */
let toastTimer;
function toast(msg){
  clearTimeout(toastTimer);
  $('#toast').text(msg).addClass('show');
  toastTimer = setTimeout(() => $('#toast').removeClass('show'), 2600);
}

/* =====================================================================
   PRINT / PDF  (with watermark)
   ===================================================================== */
function doPrint(){
  const list = computeList();
  if(!list.length){ toast('Nothing to print — adjust your filter.'); return; }

  const rows = list.map((o,i) => `<tr>
      <td>${i+1}</td>
      <td><b>${esc(o.v1)}</b></td>
      <td>${esc(o.v2)}</td>
      <td>${esc(o.v3)}</td>
      <td>${esc(sForm(o.v1))}</td>
      <td class="bn">${esc(o.as)}</td>
    </tr>`).join('');

  const label = {
    all:'All Verbs', irr:'Irregular Verbs', reg:'Regular Verbs', state:'Stative Verbs'
  }[STATE.tab];

  const letterNote = STATE.letter === '*' ? '' : ` · Letter "${STATE.letter.toUpperCase()}"`;
  const qNote = STATE.q.trim() ? ` · Search: "${esc(STATE.q.trim())}"` : '';

  $('#printArea').html(`
    <div class="print-wm" aria-hidden="true">Muzahid The Tech Master</div>
    <h1>Verb Vault — English Verb List</h1>
    <div class="sub">
      ${esc(label)}${letterNote}${qNote} &nbsp;·&nbsp; ${list.length} verbs &nbsp;·&nbsp;
      SEBA / AHSEC / CBSE / NCERT reference &nbsp;·&nbsp; ${new Date().toLocaleDateString()}
      &nbsp;·&nbsp; <b>by Muzahid The Tech Master</b>
    </div>
    <table>
      <thead>
        <tr>
          <th style="width:4%">#</th>
          <th style="width:18%">Present (V1)</th>
          <th style="width:17%">Past (V2)</th>
          <th style="width:18%">Past Participle (V3)</th>
          <th style="width:14%">s / es / ies</th>
          <th style="width:29%">Assamese Meaning</th>
        </tr>
      </thead>
      <tbody>${rows}</tbody>
    </table>
    <div class="print-credit">© Muzahid The Tech Master · Verb Vault</div>
  `);

  toast('Tip: choose “Save as PDF” in the print dialog.');
  setTimeout(() => window.print(), 320);
}

/* =====================================================================
   EVENTS
   ===================================================================== */
$(function(){
  initTheme();
  buildLetters();
  $('#totalLabel').text(VERBS.length.toLocaleString() + ' verbs · SEBA · AHSEC · CBSE');
  build();

  /* --- theme --- */
  $('#themeBtn').on('click', () => {
    const next = document.documentElement.getAttribute('data-theme') === 'dark' ? 'light' : 'dark';
    applyTheme(next);
  });

  /* --- search --- */
  let searchTimer;
  $('#q').on('input', function(){
    const v = this.value;
    $('#clearBtn').toggle(v.length > 0);
    clearTimeout(searchTimer);
    searchTimer = setTimeout(() => { STATE.q = v; build(); }, 140);
  });
  $('#clearBtn').on('click', () => {
    $('#q').val('').trigger('input').trigger('focus');
  });

  /* --- tabs --- */
  $('#tabs').on('click', '.tab', function(){
    $('.tab').removeClass('on');
    $(this).addClass('on');
    STATE.tab = $(this).data('tab');
    build();
    $('html,body').animate({ scrollTop: 0 }, 200);
  });

  /* --- letters --- */
  $('#letters').on('click', '.lt', function(){
    $('.lt').removeClass('on');
    $(this).addClass('on');
    STATE.letter = $(this).data('l');
    $('#activeHint').text(STATE.letter === '*' ? 'A – Z' : 'Letter ' + STATE.letter.toUpperCase());
    build();
  });

  /* --- load more --- */
  $('#loadMore').on('click', renderMore);

  /* --- infinite scroll --- */
  let lock = false;
  $(window).on('scroll', function(){
    if(lock) return;
    if($(window).scrollTop() + $(window).height() > $(document).height() - 400){
      if(STATE.shown < FILTERED.length){
        lock = true;
        renderMore();
        setTimeout(() => lock = false, 120);
      }
    }
  });

  /* --- bottom nav --- */
  $('.bottomnav').on('click', '.navbtn', function(){
    const act = $(this).data('nav');
    $('.navbtn').removeClass('on');
    if(act !== 'top' && act !== 'pdf') $(this).addClass('on');

    if(act === 'search'){
      $('html,body').animate({ scrollTop: 0 }, 220, () => $('#q').trigger('focus'));
    } else if(act === 'pdf'){
      doPrint();
    } else if(act === 'top'){
      $('html,body').animate({ scrollTop: 0 }, 300);
      $('.navbtn[data-nav="verbs"]').addClass('on');
    } else {
      STATE.tab = 'all'; STATE.letter = '*'; STATE.q = '';
      $('#q').val(''); $('#clearBtn').hide();
      $('.tab').removeClass('on').filter('[data-tab="all"]').addClass('on');
      $('.lt').removeClass('on').filter('[data-l="*"]').addClass('on');
      $('#activeHint').text('A – Z');
      build();
      $('html,body').animate({ scrollTop: 0 }, 300);
    }
  });

  /* --- print buttons --- */
  $('#topPrint').on('click', doPrint);

  /* --- keyboard: Ctrl/Cmd + P uses our table --- */
  $(document).on('keydown', function(e){
    if((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === 'p'){
      e.preventDefault();
      doPrint();
    }
  });
});
</script>
